<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyRoom Classroom Presence Sample</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ea;
      --text: #2f2a24;
      --muted: #746b5f;
      --panel: #fffdf8;
      --line: #d8cbbb;
      --shadow: rgba(65, 52, 38, .14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,0) 280px),
        var(--bg);
      color: var(--text);
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .sample {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      background: var(--panel);
      box-shadow: 0 12px 30px var(--shadow);
    }

    .sample-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #3d352c;
    }

    .sample-note {
      margin: 0 0 14px;
      font-size: 13px;
    }

    .count-stack {
      display: grid;
      gap: 18px;
    }

    .variant-title {
      margin: 0 0 8px;
      font-size: 14px;
      color: #5d4630;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>

          : { fill: '#ad7746', stroke: '#8f5d35' };

        ? { fill: '#dfbd8c', stroke: '#c99b67' }
        : row === 1
          ? { fill: '#d8b17e', stroke: '#bd8d58' }
          : { fill: '#cfa470', stroke: '#ac7d4d' };
      const deskStyle = person ? desk : emptyDesk;
      const seatBase = `
        <rect x="0" y="0" width="104" height="64" rx="13" fill="${deskStyle.fill}" stroke="${deskStyle.stroke}" stroke-width="1.2"/>

      const marker = person

        : '';
      return `<g transform="translate(${x} ${y})">${seatBase}${marker}</g>`;
    }
